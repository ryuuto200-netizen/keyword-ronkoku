<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244c40"><title>ことば帖｜論理国語の語彙演習</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#233c33;font:16px/1.65 system-ui,sans-serif}header,main{max-width:900px;margin:auto;padding:20px clamp(15px,4vw,40px)}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #c9cbbf;font:700 23px serif}header small{margin-left:auto;font:13px system-ui;color:#566259}header b{background:#294e40;color:#fff;padding:0 6px;border-radius:3px;font-size:20px}main{padding-bottom:70px}.cover{position:relative;overflow:hidden;background:#264e41;color:#fff9e9;border-radius:12px;padding:30px clamp(18px,5vw,44px);margin-bottom:22px}.cover h1{font:700 clamp(30px,5vw,48px)/1.35 serif;letter-spacing:.06em;margin:0 0 8px}.cover p{margin:0;color:#e5ecdf}.cover:after{content:'語';position:absolute;right:3%;top:-44px;transform:rotate(9deg);font:180px serif;color:#ffffff0d;pointer-events:none}.panel{border:1px solid #d6d6cb;background:#fffef8;padding:clamp(16px,4vw,32px);border-radius:12px;margin:14px 0}.panel h2{margin:0 0 16px;font:700 24px serif}fieldset{border:0;border-top:1px solid #dfdfd4;padding:8px 0 14px;margin:0;min-width:0}legend{font-size:14px;font-weight:bold;padding:0 10px 0 0}.row,.opts{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;gap:6px}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #c6cbbf;border-radius:7px;padding:10px;background:#fffef9;line-height:1.4;min-height:44px;overflow-wrap:anywhere}button:focus-visible,input:focus-visible+span{outline:3px solid #cc813a;outline-offset:2px}button:hover:enabled{border-color:#567b66}.row label{position:relative;cursor:pointer}.row input{position:absolute;opacity:0}.row span{display:grid;place-items:center;min-height:44px;height:100%;padding:7px 3px;text-align:center;border-radius:7px;border:1px solid #ced1c5;font-size:15px}.row input:checked+span{background:#e2ede2;border:1.5px solid #416b54;color:#244c3a;font-weight:bold}.primary{background:#284f40;color:white;font-weight:bold;border:0;width:100%;margin-top:10px}.sub{width:100%;margin-top:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.hint,.meta{font-size:14px;color:#59665b}.meta{display:flex;justify-content:space-between}.question{font:700 clamp(25px,5vw,40px)/1.45 serif;margin:10px 0 22px;overflow-wrap:anywhere}.opts{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}.opts.long{grid-template-columns:repeat(2,minmax(0,1fr))}.opts button{min-height:52px}.opts button:disabled{opacity:1;cursor:default}.yes{background:#dcefdc;border:2px solid #41784a}.no{background:#f8e2da;border:2px solid #a9533b}.mark{font-size:13px;font-weight:bold;display:block}.note{background:#f1f1e7;padding:12px;border-radius:7px;margin-top:14px}.score{font:700 46px serif;color:#285841}.item{border-top:1px solid #dddcd0;padding:12px 0}.item small{display:block;color:#64685e}progress{accent-color:#47765d;width:100%;height:8px}h1:focus,h2:focus{outline:none}@media(max-width:520px){.opts.long{grid-template-columns:1fr}.pair{gap:10px}.cover{padding:21px 17px}.panel{padding:16px}.opts button{padding:8px 4px}main{padding-top:15px}}
</style></head><body><header><b aria-hidden="true">帖</b>ことば帖<small>論理国語 ／ 語彙演習</small></header><main id="app"></main><script>
const pairs=[["普遍", "特殊"], ["具体", "抽象"], ["秩序（コスモス）", "混沌（カオス）"], ["必然", "偶然"], ["合理", "非合理"], ["虚構（フィクション）", "現実"], ["絶対", "相対"], ["一元", "多元"], ["情念（パトス）", "ロゴス、理性"], ["自律", "他律"], ["顕在", "潜在"], ["科学主義", "反科学主義"], ["帰納", "演繹"], ["有機", "無機"], ["メタファー", "シミリ、直喩、明喩"], ["差異", "同一"], ["一義", "多義"], ["自文化（自民族）中心主義", "文化相対主義"], ["主観", "客観"], ["唯物論", "唯心論、観念論"], ["ペシミズム", "オプティミズム"], ["主体", "客体"], ["理性", "感性"], ["形而上", "形而下"], ["ア・プリオリ", "ア・ポステリオリ"], ["個人", "共同体"], ["資本主義", "社会主義"], ["ロマン主義（ロマンティシズム）", "リアリズム"], ["全体主義", "個人主義"], ["マジョリティー", "マイノリティー"]];
const vocab=[["アイデンティティ", "自己同一性、存在理由"], ["アイロニー", "皮肉、反語"], ["アカデミズム", "学問至上主義"], ["アナキズム", "無政府主義"], ["アナロジー", "類推、類比"], ["アニミズム", "精霊崇拝"], ["ア・プリオリ", "先天的"], ["ア・ポステリオリ", "後天的"], ["アレゴリー", "寓意"], ["アンビヴァレンス", "両面価値"], ["イデア（イデー）", "理念"], ["イデオロギー", "信念、思想"], ["エコロジー", "生態系、生態学"], ["エスニシティ", "独自の文化を共有する集団内の人々がもつ帰属意識"], ["オプティミズム", "楽観主義"], ["オリエンタリズム", "西洋人が抱く東洋のイメージ"], ["カオス", "混沌"], ["カタルシス", "精神の浄化作用"], ["クレオール", "新大陸や植民地で育った人々、その言語や習慣"], ["グローバリゼーション", "物事の世界規模での展開"], ["コード", "規則、慣例"], ["コスモス", "秩序"], ["コンセプト", "概念"], ["コンテクスト", "文脈、ある事柄の背景やまわりの状況"], ["コンプレックス", "無意識下に抑圧された心理、劣等感"], ["ジェンダー", "社会的・文化的な性"], ["システム", "仕組み、体系"], ["シニカル", "皮肉な態度"], ["シミリ", "直喩、明喩"], ["ジャーナリズム", "新聞や放送などによる、時事的な問題の伝達活動"], ["シンボル", "象徴"], ["タブー", "禁忌"], ["ディレンマ", "板ばさみの状態"], ["テーゼ", "命題、政治的方針"], ["デカダンス", "退廃的な態度"], ["テクスト", "文章表現"], ["テクノロジー", "（科学）技術"], ["ドグマ", "教義、独断"], ["トラウマ", "心的外傷"], ["ナショナリズム", "民族主義、国民主義、国家主義"], ["ニヒリズム", "虚無主義"], ["パトス", "情念"], ["パラダイム", "思考の枠組み"], ["パラドックス", "逆説"], ["ヒューマニズム", "人道主義、人間中心主義、人文主義"], ["フィクション", "虚構"], ["フェティシズム", "物神崇拝"], ["フェミニズム", "女性解放論"], ["ペシミズム", "悲観論、厭世主義"], ["ポストモダン", "脱近代"], ["マイノリティー", "少数、少数派"], ["マジョリティー", "多数、過半数"], ["メタファー", "隠喩、暗喩"], ["モチーフ", "創作の動機の題材・思想"], ["モラトリアム", "猶予期間"], ["モラル", "道徳、倫理"], ["リアリズム", "現実主義、写実主義"], ["リスク", "ある行動や選択に伴う危険"], ["レトリック", "修辞（学）"], ["ロゴス", "言葉、論理、理性"], ["ロマンティシズム", "個人の感情や感性を重視する芸術思想"]];
const app=document.querySelector('#app');
const records=[...pairs.map(([a,b],i)=>({id:'p'+i,a,b,kind:'pair'})),...vocab.map(([a,b],i)=>({id:'v'+i,a,b,kind:'word'}))];
const settings={range:'mix',size:'10',count:'9',mode:'practice'};
let weak=new Set(), deck=[],index=0,answers=[],current,mode;
try{weak=new Set(JSON.parse(localStorage.getItem('kotobacho-review')||'[]'))}catch{}
function persist(){try{localStorage.setItem('kotobacho-review',JSON.stringify([...weak]))}catch{}}
function shuffled(items){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function radios(key,title,choices){return '<fieldset><legend>'+title+'</legend><div class="row">'+choices.map(([val,label])=>'<label><input type="radio" name="'+key+'" value="'+val+'" '+(settings[key]===val?'checked':'')+'><span>'+label+'</span></label>').join('')+'</div></fieldset>'}
function focusHeading(){window.scrollTo(0,0);app.querySelector('h1,h2')?.focus({preventScroll:true})}
function home(){app.innerHTML='<section class="cover"><h1 tabindex="-1">論理国語の語彙演習</h1><p>反意語 30組　／　カタカナ語 61語</p></section><section class="panel"><h2>演習を設定</h2>'+radios('range','出題範囲',[['mix','ミックス'],['pair','反意語'],['word','カタカナ語']])+'<div class="pair">'+radios('size','問題数',[['10','10問'],['20','20問']])+radios('count','選択肢',[['9','9択'],['12','12択']])+'</div>'+radios('mode','採点のタイミング',[['practice','練習｜1問ごと'],['test','模擬｜最後に採点']])+'<button class="primary" id="start">演習をはじめる →</button></section><button class="sub" id="review" '+(weak.size?'':'disabled')+'>苦手な語を復習（'+weak.size+'件）</button>';
app.onchange=e=>{settings[e.target.name]=e.target.value};document.querySelector('#start').onclick=()=>start(records.filter(r=>settings.range==='mix'||settings.range===r.kind));document.querySelector('#review').onclick=()=>start(records.filter(r=>weak.has(r.id)),true);focusHeading()}
function start(pool,review=false){deck=shuffled(pool).slice(0,Number(settings.size));index=0;answers=[];mode=review?'practice':settings.mode;ask()}
function short(s){return s.split(/[（、]/)[0]}
function kana(s){return /^[ァ-ヿー・]+$/.test(s)}
function makeQuestion(r,reverse=Math.random()<.5){
 const pair=r.kind==='pair';
 let cue=reverse?r.b:r.a,correct=reverse?r.a:r.b;
 if(pair){cue=short(cue);correct=short(correct)}
 // 「理性」に対する教材中の二つの対語を設問で区別する。
 const prompt=pair?(r.a==='理性'&&!reverse?'認識の働きの対比で、対になる語は？':'教材で対になる語は？'):reverse?'この意味を表すカタカナ語は？':'この語の意味は？';
 let pool=pair?[...pairs.flat().map(short),...vocab.map(p=>p[0])].filter(s=>kana(short(s))===kana(correct)):vocab.map(p=>p[reverse?0:1]);
 const blocked=new Set([cue,correct,...(pair?[r.a,r.b].flatMap(s=>s.split(/[（）、]/)):[])]);
 if(pair&&cue==='理性'){blocked.add('情念');blocked.add('パトス')}
 const related=[['アイロニー','シニカル'],['コンセプト','イデア（イデー）'],['ロゴス','理性'],['ロマンティシズム','ロマン主義']];
 for(const group of related){if(group.includes(r.a)||group.includes(correct)||group.includes(cue)){for(const name of group){blocked.add(name);const match=vocab.find(p=>p[0]===name);if(match)blocked.add(match[1])}}}
 const options=shuffled([correct,...shuffled([...new Set(pool)].filter(s=>!blocked.has(s))).slice(0,Number(settings.count)-1)]);
 return {r,cue,correct,prompt,options}
}
function ask(){current=makeQuestion(deck[index]);const q=current;
 app.innerHTML='<section class="panel"><div class="meta"><span>'+ (mode==='test'?'模擬テスト':'練習')+' ／ '+(q.r.kind==='pair'?'反意語':'カタカナ語')+'</span><strong>'+(index+1)+' / '+deck.length+' 問</strong></div><progress value="'+(index+1)+'" max="'+deck.length+'"></progress><p>'+q.prompt+'</p><h1 class="question" tabindex="-1">'+q.cue+'</h1><div class="opts '+(q.options.some(s=>s.length>10)?'long':'')+'">'+q.options.map((s,i)=>'<button data-choice="'+i+'">'+s+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section><button id="quit">演習を終了</button>';
 app.querySelectorAll('[data-choice]').forEach((b,i)=>b.onclick=()=>choose(i));document.querySelector('#quit').onclick=()=>{if(confirm('ここで演習を終了しますか？'))home()};focusHeading()}
function choose(i){if(answers.length>index)return;const q=current,chosen=q.options[i],ok=chosen===q.correct;answers.push({...q,chosen,ok});
 if(ok)weak.delete(q.r.id);else weak.add(q.r.id);persist();
 const buttons=app.querySelectorAll('[data-choice]');buttons.forEach((b,j)=>{b.disabled=true;if(mode==='practice'){const right=q.options[j]===q.correct;if(right||j===i){b.className=right?'yes':'no';b.insertAdjacentHTML('afterbegin','<span class="mark">'+(right?'✓ 正解':'× 選択')+'</span>')}}});
 const fb=document.querySelector('#feedback');fb.innerHTML=(mode==='practice'?'<div class="note"><strong>'+(ok?'正解':'不正解')+'</strong>　'+q.r.a+(q.r.kind==='pair'?' ↔ ':' ＝ ')+q.r.b+'</div>':'')+'<button class="primary" id="next">'+(index+1===deck.length?'結果を見る':'次の問題へ →')+'</button>';const next=document.querySelector('#next');next.onclick=()=>{index++;if(index===deck.length)result();else ask()};next.focus()}
function result(){const missed=answers.filter(a=>!a.ok);app.innerHTML='<section class="panel"><h1 tabindex="-1">演習結果</h1><div class="score">'+(answers.length-missed.length)+' / '+answers.length+' 問正解</div>'+(missed.length?'<button class="primary" id="retry">間違えた '+missed.length+' 問を解き直す</button>':'<p>全問正解です。</p>')+'<button class="sub" id="back">演習設定に戻る</button></section><section class="panel"><h2>解答一覧</h2>'+answers.map(a=>'<div class="item"><strong>'+(a.ok?'○':'×')+'　'+a.cue+'</strong><small>'+(!a.ok?'選んだ答え　'+a.chosen+'<br>':'')+'正解　'+a.correct+'</small></div>').join('')+'</section>';
 document.querySelector('#back').onclick=home;if(missed.length)document.querySelector('#retry').onclick=()=>start(missed.map(a=>a.r),true);focusHeading()}
home();
</script></body></html>
