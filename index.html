</style></head><body><header><button id="brand" aria-label="ことば帖 ホームに戻る"><b aria-hidden="true">帖</b> ことば帖</button><small>論理国語 ／ 語彙演習</small></header><main id="app"></main><script>
const pairs=[["普遍", "特殊"], ["具体", "抽象"], ["秩序（コスモス）", "混沌（カオス）"], ["必然", "偶然"], ["合理", "非合理"], ["虚構（フィクション）", "現実"], ["絶対", "相対"], ["一元", "多元"], ["情念（パトス）", "ロゴス、理性"], ["自律", "他律"], ["顕在", "潜在"], ["科学主義", "反科学主義"], ["帰納", "演繹"], ["有機", "無機"], ["メタファー", "シミリ、直喩、明喩"], ["差異", "同一"], ["一義", "多義"], ["自文化（自民族）中心主義", "文化相対主義"], ["主観", "客観"], ["唯物論", "唯心論、観念論"], ["ペシミズム", "オプティミズム"], ["主体", "客体"], ["理性", "感性"], ["形而上", "形而下"], ["ア・プリオリ", "ア・ポステリオリ"], ["個人", "共同体"], ["資本主義", "社会主義"], ["ロマン主義（ロマンティシズム）", "リアリズム"], ["全体主義", "個人主義"], ["マジョリティー", "マイノリティー"]];
const vocab=[["アイデンティティ", "自己同一性、存在理由"], ["アイロニー", "皮肉、反語"], ["アカデミズム", "学問至上主義"], ["アナキズム", "無政府主義"], ["アナロジー", "類推、類比"], ["アニミズム", "精霊崇拝"], ["ア・プリオリ", "先天的"], ["ア・ポステリオリ", "後天的"], ["アレゴリー", "寓意"], ["アンビヴァレンス", "両面価値"], ["イデア（イデー）", "理念"], ["イデオロギー", "信念、思想"], ["エコロジー", "生態系、生態学"], ["エスニシティ", "独自の文化を共有する集団内の人々がもつ帰属意識"], ["オプティミズム", "楽観主義"], ["オリエンタリズム", "西洋人が抱く東洋のイメージ"], ["カオス", "混沌"], ["カタルシス", "精神の浄化作用"], ["クレオール", "新大陸や植民地で育った人々、その言語や習慣"], ["グローバリゼーション", "物事の世界規模での展開"], ["コード", "規則、慣例"], ["コスモス", "秩序"], ["コンセプト", "概念"], ["コンテクスト", "文脈、ある事柄の背景やまわりの状況"], ["コンプレックス", "無意識下に抑圧された心理、劣等感"], ["ジェンダー", "社会的・文化的な性"], ["システム", "仕組み、体系"], ["シニカル", "皮肉な態度"], ["シミリ", "直喩、明喩"], ["ジャーナリズム", "新聞や放送などによる、時事的な問題の伝達活動"], ["シンボル", "象徴"], ["タブー", "禁忌"], ["ディレンマ", "板ばさみの状態"], ["テーゼ", "命題、政治的方針"], ["デカダンス", "退廃的な態度"], ["テクスト", "文章表現"], ["テクノロジー", "（科学）技術"], ["ドグマ", "教義、独断"], ["トラウマ", "心的外傷"], ["ナショナリズム", "民族主義、国民主義、国家主義"], ["ニヒリズム", "虚無主義"], ["パトス", "情念"], ["パラダイム", "思考の枠組み"], ["パラドックス", "逆説"], ["ヒューマニズム", "人道主義、人間中心主義、人文主義"], ["フィクション", "虚構"], ["フェティシズム", "物神崇拝"], ["フェミニズム", "女性解放論"], ["ペシミズム", "悲観論、厭世主義"], ["ポストモダン", "脱近代"], ["マイノリティー", "少数、少数派"], ["マジョリティー", "多数、過半数"], ["メタファー", "隠喩、暗喩"], ["モチーフ", "創作の動機の題材・思想"], ["モラトリアム", "猶予期間"], ["モラル", "道徳、倫理"], ["リアリズム", "現実主義、写実主義"], ["リスク", "ある行動や選択に伴う危険"], ["レトリック", "修辞（学）"], ["ロゴス", "言葉、論理、理性"], ["ロマンティシズム", "個人の感情や感性を重視する芸術思想"]];
const app=document.querySelector('#app');
const records=[...pairs.map(([a,b],i)=>({id:'p'+i,a,b,kind:'pair'})),...vocab.map(([a,b],i)=>({id:'v'+i,a,b,kind:'word'}))];
const settings={range:'mix',size:'10',count:'9',mode:'practice'};
let weak=new Set(), deck=[],index=0,answers=[],current,mode;
try{weak=new Set(JSON.parse(localStorage.getItem('kotobacho-review')||'[]'))}catch{}
function persist(){try{localStorage.setItem('kotobacho-review',JSON.stringify([...weak]))}catch{}}
const attempts = Object.create(null);
try {
  const saved = JSON.parse(localStorage.getItem('kotobacho-attempts') || '{}');
  for (const {id} of records) {
    if (Number.isSafeInteger(saved?.[id]) && saved[id] > 0) attempts[id] = saved[id];
  }
} catch {}
function recordAttempt(id) {
  attempts[id] = (attempts[id] || 0) + 1;
  try { localStorage.setItem('kotobacho-attempts', JSON.stringify(attempts)); } catch {}
}
function progressLine(kind, label) {
  const group = records.filter(r => r.kind === kind);
  const total = group.filter(r => attempts[r.id]).length;
  return '<div><span>'+label+'</span><strong>'+total+' / '+group.length+'</strong><progress aria-label="'+label+'の学習済み件数" value="'+total+'" max="'+group.length+'"></progress></div>';
}
function shuffled(items){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function radios(key,title,choices){return '<fieldset><legend>'+title+'</legend><div class="row">'+choices.map(([val,label])=>'<label><input type="radio" name="'+key+'" value="'+val+'" '+(settings[key]===val?'checked':'')+'><span>'+label+'</span></label>').join('')+'</div></fieldset>'}
function focusHeading(){window.scrollTo(0,0);app.querySelector('h1,h2')?.focus({preventScroll:true})}
function home(){app.className='dashboard';app.innerHTML='<section class="cover"><h1 tabindex="-1">論理国語の語彙演習</h1><p>反意語 30組　／　カタカナ語 61語</p><div class="coverage" aria-label="解答した項目数">'+progressLine('pair','解答済みの反意語')+progressLine('word','解答済みのカタカナ語')+'</div></section><section class="panel"><h2>演習を設定</h2>'+radios('range','出題範囲',[['mix','ミックス'],['pair','反意語'],['word','カタカナ語']])+'<div class="pair">'+radios('size','問題数',[['10','10問'],['20','20問']])+radios('count','選択肢',[['9','9択'],['12','12択']])+'</div>'+radios('mode','採点のタイミング',[['practice','練習｜1問ごと'],['test','模擬｜最後に採点']])+'<button class="primary" id="start">演習をはじめる →</button></section><nav class="study-links" aria-label="学習メニュー"><button class="sub" id="book">単語帳を開く</button><button class="sub" id="review" '+(weak.size?'':'disabled')+'>苦手な語を復習（'+weak.size+'件）</button></nav>';
document.querySelector("#book").onclick=openBook;app.onchange=e=>{if(Object.hasOwn(settings,e.target.name))settings[e.target.name]=e.target.value};document.querySelector('#start').onclick=()=>start(records.filter(r=>settings.range==='mix'||settings.range===r.kind));document.querySelector('#review').onclick=()=>start(records.filter(r=>weak.has(r.id)),true);focusHeading()}
function normalized(text) {
  return text.normalize('NFKC').toLowerCase().trim().replace(/[ぁ-ゖ]/g, c=>String.fromCharCode(c.charCodeAt(0)+96));
}
function openBook(){
  app.className='';
  app.innerHTML = '<section class="cover"><h1 tabindex="-1">単語帳</h1><p>語をタップして、反意語や意味を確認できます。</p></section><section class="panel booklist"><label>表示する範囲　<select id="section"><option value="all">すべて（91件）</option><option value="pair">反意語（30組）</option><option value="word">カタカナ語（61語）</option></select></label><label class="searchlabel">語句・意味で検索<input type="search" id="lookup" placeholder="例：こすもす、混沌"></label><p class="hint" id="matches" role="status"></p><div id="entries"></div></section>';
  const section=document.querySelector('#section');
  function showEntries(){
    const query = normalized(document.querySelector('#lookup').value);
    const matches = records.filter(r=>(section.value==='all'||r.kind===section.value) && normalized(r.a+' '+r.b).includes(query));
    document.querySelector('#matches').textContent = matches.length ? matches.length+'件' : '一致する語句がありません。';
    document.querySelector('#entries').innerHTML=matches
      .map(r=>'<details><summary>'+r.a+'</summary><p>'+r.b+'</p></details>').join('');
  }
  document.querySelector('#lookup').oninput=showEntries;
  section.onchange=showEntries;
  showEntries();
  focusHeading();
}
document.querySelector('#brand').onclick=home;
function start(pool, review=false, retryDirections=new Map()){
  const ordered=shuffled(pool);
  if(!review && settings.mode==='practice') {
    ordered.sort((a,b)=>(attempts[a.id]||0)-(attempts[b.id]||0));
  }
  deck=ordered.slice(0,Number(settings.size)).map(r=>({r, reverse:retryDirections.get(r.id) ?? Math.random()<0.5}));
  index=0;
  answers=[];
  mode=review?'practice':settings.mode;
  ask();
}
function short(s){return s.replace(/（[^）]*）/g,'').split('、')[0]}
function kana(s){return /^[ァ-ヿー・]+$/.test(s)}
const studyGroups=[
 'コスモス カオス コード システム','ア・プリオリ ア・ポステリオリ','ペシミズム オプティミズム ニヒリズム','マジョリティー マイノリティー','メタファー シミリ アレゴリー シンボル レトリック','アナロジー パラドックス アイロニー','パトス ロゴス','フィクション リアリズム ロマンティシズム','イデア（イデー） イデオロギー コンセプト パラダイム ドグマ テーゼ','コンテクスト コンセプト テクスト','アイデンティティ エスニシティ ナショナリズム','アニミズム フェティシズム','トラウマ コンプレックス アンビヴァレンス ディレンマ','モラル モラトリアム モチーフ','アナキズム フェミニズム ヒューマニズム アカデミズム','ポストモダン グローバリゼーション オリエンタリズム','カタルシス デカダンス シニカル','エコロジー テクノロジー システム','クレオール エスニシティ ジェンダー','ジャーナリズム テクスト コード','タブー モラル ドグマ','リスク ディレンマ パラドックス',
 '普遍 特殊 具体 抽象','秩序 混沌 合理 非合理','必然 偶然 絶対 相対','一元 多元 一義 多義','主観 客観 主体 客体','理性 感性 情念','自律 他律 個人 共同体','顕在 潜在 虚構 現実','帰納 演繹 具体 抽象','有機 無機 形而上 形而下','差異 同一 特殊 普遍','唯物論 唯心論 科学主義 反科学主義','全体主義 個人主義 資本主義 社会主義','自文化中心主義 文化相対主義 絶対 相対'
].map(line=>line.split(' '));
function makeQuestion(r,reverse=Math.random()<.5){
 const pair=r.kind==='pair';
 let cue=reverse?r.b:r.a,correct=reverse?r.a:r.b;
 if(pair){cue=short(cue);correct=short(correct)}
 // 「理性」に対する教材中の二つの対語を設問で区別する。
 const prompt=pair?(r.a==='理性'&&!reverse?'認識の働きの対比で、対になる語は？':'教材で対になる語は？'):reverse?'この意味を表すカタカナ語は？':'この語の意味は？';
 let pool=pair?[...pairs.flat().map(short),...vocab.map(p=>p[0])].filter(s=>kana(short(s))===kana(correct)):vocab.map(p=>p[reverse?0:1]);
 const blocked=new Set([cue,correct,...(pair?[r.a,r.b].flatMap(s=>s.split(/[（）、]/)):[])]);
 if(pair&&cue==='理性'){blocked.add('情念');blocked.add('パトス')}
 const related=[['アイロニー','シニカル'],['コンセプト','イデア（イデー）'],['ロゴス','理性'],['ロマンティシズム','ロマン主義']];
 for(const group of related){if(group.includes(r.a)||group.includes(correct)||group.includes(cue)){for(const name of group){blocked.add(name);const match=vocab.find(p=>p[0]===name);if(match)blocked.add(match[1])}}}
 const eligible=[...new Set(pool)].filter(s=>!blocked.has(s));
 const keys=pair?[cue,correct]:[r.a];
 const nearby=new Set(studyGroups.filter(group=>keys.some(key=>group.includes(key))).flat());
 const preferred=eligible.filter(answer=>{
   if(pair||reverse)return nearby.has(answer);
   return vocab.some(([word,meaning])=>meaning===answer&&nearby.has(word));
 });
 const priority=shuffled(preferred).slice(0,3);
 const rest=shuffled(eligible.filter(s=>!priority.includes(s)));
 const options=shuffled([correct,...priority,...rest.slice(0,Number(settings.count)-1-priority.length)]);
 return {r,cue,correct,prompt,options,reverse}
}
function ask(){app.className='';current=makeQuestion(deck[index].r,deck[index].reverse);const q=current;
 app.innerHTML='<section class="panel"><div class="meta"><span>'+ (mode==='test'?'模擬テスト':'練習')+' ／ '+(q.r.kind==='pair'?'反意語':'カタカナ語')+'</span><strong>'+(index+1)+' / '+deck.length+' 問</strong></div><progress aria-label="演習の進み具合" value="'+(index+1)+'" max="'+deck.length+'"></progress><div class="stem"><p>'+q.prompt+'</p><h1 class="question" tabindex="-1">'+q.cue+'</h1></div><div class="opts '+(q.options.filter(s=>s.length>10).length>3?'long':'')+'">'+q.options.map((s,i)=>'<button class="'+(s.length>10?'wide':'')+'" data-choice="'+i+'">'+s+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section><button id="quit">演習を終了</button>';
 app.querySelectorAll('[data-choice]').forEach((b,i)=>b.onclick=()=>choose(i));document.querySelector('#quit').onclick=()=>{if(confirm('ここで演習を終了しますか？'))home()};focusHeading()}
function choose(i){if(answers.length>index)return;const q=current,chosen=q.options[i],ok=chosen===q.correct;answers.push({...q,chosen,ok});
 recordAttempt(q.r.id);
 if(ok)weak.delete(q.r.id);else weak.add(q.r.id);persist();
 const buttons=app.querySelectorAll('[data-choice]');buttons.forEach((b,j)=>{b.disabled=true;if(mode==='test'&&j===i){b.classList.add('selected');b.insertAdjacentHTML('afterbegin','<span class="mark">✓ 選択済み</span>')}if(mode==='practice'){const right=q.options[j]===q.correct;if(right||j===i){b.classList.add(right?'yes':'no');b.insertAdjacentHTML('afterbegin','<span class="mark">'+(right?'✓ 正解':'× 選択')+'</span>')}}});
 const fb=document.querySelector('#feedback');fb.innerHTML=(mode==='practice'?'<div class="note"><strong>'+(ok?'正解':'不正解')+'</strong>　'+q.r.a+(q.r.kind==='pair'?' ↔ ':' ＝ ')+q.r.b+'</div>':'')+'<button class="primary" id="next">'+(index+1===deck.length?'結果を見る':'次の問題へ →')+'</button>';const next=document.querySelector('#next');next.onclick=()=>{index++;if(index===deck.length)result();else ask()};next.focus()}
function result(){const missed=answers.filter(a=>!a.ok);app.innerHTML='<section class="panel"><h1 tabindex="-1">演習結果</h1><div class="score">'+(answers.length-missed.length)+' / '+answers.length+' 問正解</div>'+(missed.length?'<button class="primary" id="retry">間違えた '+missed.length+' 問を解き直す</button>':'<p>全問正解です。</p>')+'<button class="sub" id="back">演習設定に戻る</button></section><section class="panel"><h2>解答一覧</h2>'+answers.map(a=>'<div class="item"><strong>'+(a.ok?'○':'×')+'　'+a.cue+'</strong><small>'+(!a.ok?'選んだ答え　'+a.chosen+'<br>':'')+'正解　'+a.correct+'</small></div>').join('')+'</section>';
 document.querySelector('#back').onclick=home;if(missed.length)document.querySelector('#retry').onclick=()=>start(missed.map(a=>a.r),true,new Map(missed.map(a=>[a.r.id,a.reverse])));focusHeading()}
home();
</script></body></html>
